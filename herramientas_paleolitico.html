<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geografía e Historia · Herramientas del Paleolítico</title><style>body{font-family:system-ui,Arial;background:#f5f3ed;color:#25252a;max-width:850px;margin:auto;padding:24px}h1{color:#65409a}.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #0001}button{background:#65409a;color:white;border:0;border-radius:9px;padding:10px 14px;cursor:pointer}select{padding:9px;max-width:100%}.feedback{font-weight:700}small{color:#666}</style></head><body><a href="index.html">← Aula de Roger</a><h1>Geografía e Historia · Paleolítico</h1><p><strong>Tema acumulativo:</strong> Las primeras herramientas. Este archivo se puede enlazar desde la asignatura sin borrar otros temas.</p><div id="cards"></div><h2>Practica lo aprendido</h2><p>Elige la respuesta correcta. Puedes repetir el ejercicio todas las veces que quieras.</p><div id="quiz"></div><button onclick="check()">Corregir respuestas</button> <button onclick="resetQuiz()">Volver a practicar</button><p id="score" aria-live="polite"></p><script>const tools=[['Aguja','Hueso o asta','Fina y alargada, con punta y un pequeño agujero','Coser pieles y fabricar ropa'],['Buril','Piedra, especialmente sílex','Pequeño, con una punta dura y afilada','Grabar y trabajar huesos y astas'],['Bifaz','Piedra, como el sílex','Tallado por ambas caras, con bordes cortantes','Cortar y golpear'],['Arpón','Hueso o asta','Alargado, con punta y dientes o ganchos','Capturar peces'],['Raedera','Piedra, normalmente sílex','Lasca con un borde afilado','Raspar y limpiar pieles']];document.getElementById('cards').innerHTML=tools.map(t=>`<section class="card"><h3>${t[0]}</h3><p><b>¿Qué es?</b> Una herramienta del Paleolítico.</p><p><b>Material:</b> ${t[1]}.</p><p><b>¿Cómo es?</b> ${t[2]}.</p><p><b>¿Para qué servía?</b> ${t[3]}.</p><p><b>Época:</b> Paleolítico.</p></section>`).join('');const questions=[['¿Qué herramienta servía para coser pieles?','Aguja',['Aguja','Arpón','Bifaz']],['¿Qué herramienta se utilizaba para grabar?','Buril',['Raedera','Buril','Aguja']],['¿Qué herramienta se tallaba por las dos caras?','Bifaz',['Bifaz','Arpón','Buril']],['¿Qué herramienta se usaba para pescar?','Arpón',['Raedera','Aguja','Arpón']],['¿Qué herramienta servía para raspar pieles?','Raedera',['Buril','Raedera','Bifaz']],['¿Con qué se fabricaban las agujas?','Hueso o asta',['Hierro','Hueso o asta','Plástico']],['¿De qué material eran los bifaces?','Piedra',['Vidrio','Piedra','Bronce']],['¿En qué etapa se usaban estas herramientas?','Paleolítico',['Edad Media','Paleolítico','Edad Moderna']]];function render(){document.getElementById('quiz').innerHTML=questions.map((q,i)=>`<div class="card"><label for="q${i}"><b>${i+1}. ${q[0]}</b></label><p><select id="q${i}"><option value="">Selecciona una respuesta</option>${q[2].map(a=>`<option value="${a}">${a}</option>`).join('')}</select></p><div id="f${i}" class="feedback"></div></div>`).join('')}function check(){let n=0;questions.forEach((q,i)=>{let a=document.getElementById('q'+i).value,ok=a===q[1];if(ok)n++;document.getElementById('f'+i).textContent=!a?'Selecciona una respuesta.':ok?'✓ Correcto':'✗ Respuesta correcta: '+q[1]});document.getElementById('score').textContent=`Resultado: ${n} de ${questions.length} correctas.`}function resetQuiz(){render();document.getElementById('score').textContent=''}render();</script></body></html>
